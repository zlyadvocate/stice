# stserver configuration for running the test suite.
# The integration tests (test_stserver_*) connect with username "testuser"
# and password "123456", so this config must match.

listenAddress = 0.0.0.0
udpPort = 3478
tcpPort = 3478
realm = stserver
users = testuser:123456
maxAllocations = 4096
allocationLifetime = 600
relayPortBegin = 49152
relayPortEnd = 65535
logLevel = warn
workerCount = 4
